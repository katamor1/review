[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bzr-step-count"
version = "0.1.0"
description = "Count raw unified-diff step changes between Bazaar revisions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
release = ["pyinstaller>=6.21,<7"]

[project.scripts]
bzr-step-count = "bzr_step_count.cli:main"
review-stats = "bzr_step_count.review_cli:main"
review-stats-gui = "bzr_step_count.review_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
