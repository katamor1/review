name: Windows single-file release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests and build one executable
        shell: pwsh
        run: ./scripts/build_release.ps1 -Python python

      - name: Smoke-test bundled CLI routes
        shell: pwsh
        run: |
          .\dist\review-stats.exe --help
          .\dist\review-stats.exe stats --help
          .\dist\review-stats.exe count --help

      - name: Upload the executable without wrapping it in another archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/review-stats.exe
          archive: false
          if-no-files-found: error

      - name: Attach the executable to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag "dist/review-stats.exe" --clobber
          }
          else {
              gh release create $tag "dist/review-stats.exe" --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
